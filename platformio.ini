; Black Pill (STM32F103C8T6) camera shutter speed tester.
;
; 128 KiB clone? use the `blackpill_f103c8_128` environment below (only the
; linker limit differs; the LED pin is PB12 either way).
; No ST-Link? this board's `upload.protocols` list has no `dfu`: the F103 needs
; the stm32duino (Maple) bootloader for USB uploads. Flash over `serial` or
; `stlink` and wiring a D+ pull-up is not needed on the Black Pill (see README).

[platformio]
default_envs = blackpill_f103c8

[env:blackpill_f103c8]
; Pinned versions: the build must not change when a new release lands in the
; registry. `platformio.ini` is the only lock file PlatformIO has.
; The gcc 14.2 pin is not cosmetic: the core 3.0.0 linker script needs a newer
; ld than gcc 9 ships. With gcc 9 the link fails on `.ARM.extab` (non constant
; address expression). Do not downgrade the toolchain alone.
platform = ststm32@20.0.0
platform_packages =
  platformio/framework-arduinoststm32@4.30000.0   ; STM32duino core 3.0.0.
  platformio/toolchain-gccarmnoneeabi@1.140201.0  ; gcc 14.2.
  platformio/tool-openocd@3.1200.7                ; OpenOCD 0.12.
board = blackpill_f103c8
framework = arduino
; This ST-Link dongle runs firmware older than V2J24, which OpenOCD only
; drives in legacy HLA mode. OpenOCD 0.12 keeps that layout in
; `stlink-hla.cfg`; plain `stlink.cfg` is the newer dapdirect driver and it
; refuses this dongle. Update the dongle firmware (STSW-LINK007) and set
; `upload_protocol = stlink` to go back to the stock flow.
upload_protocol = custom
upload_command =
  $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -f interface/stlink-hla.cfg -f target/stm32f1x.cfg -c "program $BUILD_DIR/firmware.elf verify; shutdown;"

; Enables the STM32duino USB device stack and makes `Serial` mean `SerialUSB`.
; The framework builder turns this one flag into USBD_USE_CDC, USBCON,
; USB_VID, USB_PID and HAL_PCD_MODULE_ENABLED, and it builds the USBDevice
; library. Do not define those by hand.
build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
; -O2 on the project sources only: the crossing scan is the CPU hot path
; (one pass per 1.024 ms buffer half), and the register-pressure relief
; measurably shortens it. The pinned framework keeps its own -Os default.
build_src_flags = -O2

; Also write the Intel HEX image (see the script header).
extra_scripts = post:scripts/firmware_hex.py

; 128 KiB clone. Only the linker limit differs from the 64 KiB board above.
[env:blackpill_f103c8_128]
extends = env:blackpill_f103c8
board = blackpill_f103c8_128

; Native unit tests for the pure scan module (issue 5). test_build_src
; compiles src/scan.cpp (and the ARDUINO-guarded stubs) into the test binary;
; the pre-script regenerates the hand-crafted test vectors in
; test/test_data.h (gitignored) before the build.
[env:native]
platform = native
test_build_src = true
test_filter = test_scan
extra_scripts = pre:scripts/gen_test_data.py
build_flags = -Isrc
