; Black Pill (STM32F103C8T6) camera shutter speed tester.
;
; 128 KiB clone? use the `blackpill_f103c8_128` environment below (only the
; linker limit differs; the LED pin is PB12 either way).
; No ST-Link? this board's `upload.protocols` list has no `dfu`: the F103 needs
; the stm32duino (Maple) bootloader for USB uploads. Flash over `serial` or
; `stlink` and wiring a D+ pull-up is not needed on the Black Pill (see README).

[platformio]
default_envs = blackpill_f103c8

[env:blackpill_f103c8]
platform = ststm32
board = blackpill_f103c8
framework = arduino
; This ST-Link dongle runs firmware older than V2J24, which OpenOCD only
; drives in legacy HLA mode. The `custom` protocol runs OpenOCD with the HLA
; interface file. Update the dongle firmware (STSW-LINK007) and set
; `upload_protocol = stlink` to go back to the stock flow.
upload_protocol = custom
upload_command =
  $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -f interface/stlink.cfg -f target/stm32f1x.cfg -c "program $BUILD_DIR/firmware.elf verify; shutdown;"

; Enables the STM32duino USB device stack and makes `Serial` mean `SerialUSB`.
; Do not define USBD_USE_CDC by hand: this flag also pulls in the USBDevice
; library and HAL_PCD. The registry framework 4.10900.200819 (core 2.3.0)
; does not set USBCON in its builder (later cores do), so this build defines
; USBCON here.
build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC -D USBCON

; Also write the Intel HEX image (see the script header).
extra_scripts = post:scripts/firmware_hex.py

; 128 KiB clone. Only the linker limit differs from the 64 KiB board above.
[env:blackpill_f103c8_128]
extends = env:blackpill_f103c8
board = blackpill_f103c8_128
