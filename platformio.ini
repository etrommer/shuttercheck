; Blue Pill (STM32F103C8T6) camera shutter speed tester.
;
; 128 KiB clone? change the board to `bluepill_f103c8_128k` (only the linker
; limit differs; the LED pin is PC13 either way).
; No ST-Link? set upload_protocol = dfu and boot with BOOT0 = 1.

[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink

; Enables the STM32duino USB device stack and makes `Serial` mean `SerialUSB`.
; Do not define USBD_USE_CDC by hand: this flag also pulls in USBCON, USB_VID/
; USB_PID (from the board's hwids), the USBDevice library and HAL_PCD.
build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
