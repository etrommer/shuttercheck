name: PlatformIO CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - blackpill_f103c8
          - blackpill_f103c8_128
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build PlatformIO project
        run: pio run -e ${{ matrix.environment }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Run native unit tests
        run: |
          python scripts/gen_test_data.py
          pio test -e native
      - name: Install plot dependency
        run: pip install matplotlib
      - name: Scan trace smoke test
        run: |
          python scripts/trace_scan.py docs/bands-plot.json --out /tmp/bands-plot.svg --check
          test -s /tmp/bands-plot.svg
      - name: Build test-case plots
        run: python scripts/trace_test_cases.py --out test-plots
      - name: Upload test-case plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-trace-plots
          path: test-plots/*.svg
          if-no-files-found: warn
